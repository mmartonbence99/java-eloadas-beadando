<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<title th:text="${title} + ' - Beadandó'">Beadandó</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" th:href="@{/assets/css/main.css}" />
	<link rel="stylesheet" th:href="@{/css/app.css}" />
	<noscript><link rel="stylesheet" th:href="@{/assets/css/noscript.css}" /></noscript>
</head>
<body>

<nav id="topnav" th:fragment="menu(active)">
	<a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Főoldal</a>
	<a th:href="@{/soap}" th:classappend="${active == 'soap'} ? 'active'">SOAP</a>
	<a th:href="@{/forex-account}" th:classappend="${active == 'forex-account'} ? 'active'">Forex-account</a>
	<a th:href="@{/forex-aktar}" th:classappend="${active == 'forex-aktar'} ? 'active'">Forex-AktÁr</a>
	<a th:href="@{/forex-histar}" th:classappend="${active == 'forex-histar'} ? 'active'">Forex-HistÁr</a>
	<a th:href="@{/forex-nyit}" th:classappend="${active == 'forex-nyit'} ? 'active'">Forex-Nyit</a>
	<a th:href="@{/forex-poz}" th:classappend="${active == 'forex-poz'} ? 'active'">Forex-Poz</a>
	<a th:href="@{/forex-zar}" th:classappend="${active == 'forex-zar'} ? 'active'">Forex-Zár</a>
</nav>

<section id="footer" th:fragment="footer">
	<p class="authors">
		Készítették:
		<span th:text="${@environment.getProperty('authors.1')}">Név 1 (NEPTUN1)</span>,
		<span th:text="${@environment.getProperty('authors.2')}">Név 2 (NEPTUN2)</span>
	</p>
	<ul class="copyright">
		<li>Design: <a href="http://html5up.net">HTML5 UP (Photon)</a></li>
	</ul>
</section>

<th:block th:fragment="scripts">
	<script th:src="@{/assets/js/jquery.min.js}"></script>
	<script th:src="@{/assets/js/jquery.scrolly.min.js}"></script>
	<script th:src="@{/assets/js/browser.min.js}"></script>
	<script th:src="@{/assets/js/breakpoints.min.js}"></script>
	<script th:src="@{/assets/js/util.js}"></script>
	<script th:src="@{/assets/js/main.js}"></script>
</th:block>

</body>
</html>
