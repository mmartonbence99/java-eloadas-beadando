<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex-Poz')}"></head>
<body class="is-preload">

<nav th:replace="~{fragments/layout :: menu('forex-poz')}"></nav>

<section class="main style1 page-content">
	<div class="container">
		<header class="major">
			<h2>Nyitott pozíciók</h2>
		</header>

		<p th:if="${error}" th:text="${error}"></p>

		<p th:if="${trades != null and #lists.isEmpty(trades)}">Nincs nyitott pozíció.</p>
		<div class="table-wrapper" th:if="${trades != null and !#lists.isEmpty(trades)}">
			<table>
				<thead>
					<tr><th>Trade ID</th><th>Instrumentum</th><th>Mennyiség</th><th>Nyitási ár</th><th>Nyitás ideje</th><th>Nem realizált P/L</th></tr>
				</thead>
				<tbody>
					<tr th:each="t : ${trades}">
						<td th:text="${t.id}"></td>
						<td th:text="${t.instrument}"></td>
						<td th:text="${t.currentUnits}"></td>
						<td th:text="${t.price}"></td>
						<td th:text="${t.openTime}"></td>
						<td th:text="${t.unrealizedPL}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</section>

<section th:replace="~{fragments/layout :: footer}"></section>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
