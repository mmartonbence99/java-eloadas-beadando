<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex-AktÁr')}"></head>
<body class="is-preload">

<nav th:replace="~{fragments/layout :: menu('forex-aktar')}"></nav>

<section class="main style1 page-content">
	<div class="container">
		<header class="major">
			<h2>Aktuális ár</h2>
		</header>

		<form method="get" th:action="@{/forex-aktar}">
			<div class="row gtr-uniform gtr-50">
				<div class="col-8 col-12-small">
					<select name="instrument">
						<option th:each="i : ${instruments}" th:value="${i}" th:text="${i}"
								th:selected="${i == instrument}"></option>
					</select>
				</div>
				<div class="col-4 col-12-small">
					<input type="submit" value="Lekérdezés" class="primary" />
				</div>
			</div>
		</form>

		<p th:if="${error}" th:text="${error}"></p>

		<div class="table-wrapper" th:if="${price != null}">
			<table>
				<tbody>
					<tr><td>Instrumentum</td><td th:text="${price.instrument}"></td></tr>
					<tr><td>Idő</td><td th:text="${price.time}"></td></tr>
					<tr><td>Vételi ár (bid)</td><td th:text="${price.bids[0].price}"></td></tr>
					<tr><td>Eladási ár (ask)</td><td th:text="${price.asks[0].price}"></td></tr>
				</tbody>
			</table>
		</div>
	</div>
</section>

<section th:replace="~{fragments/layout :: footer}"></section>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
