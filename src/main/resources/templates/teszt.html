<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Teszt')}"></head>
<body class="is-preload">

<nav th:replace="~{fragments/layout :: menu('teszt')}"></nav>

<section class="main style1 page-content">
	<div class="container">
		<header class="major">
			<h2>Számológép</h2>
		</header>

		<form method="post" th:action="@{/teszt}">
			<div class="row gtr-uniform gtr-50">
				<div class="col-3 col-12-small">
					<label for="left">Első szám</label>
					<input id="left" type="number" step="any" name="left" th:value="${left}" required />
				</div>
				<div class="col-3 col-12-small">
					<label for="operation">Művelet</label>
					<select id="operation" name="operation">
						<option value="add" th:selected="${operation == 'add'}">Összeadás</option>
						<option value="subtract" th:selected="${operation == 'subtract'}">Kivonás</option>
						<option value="multiply" th:selected="${operation == 'multiply'}">Szorzás</option>
						<option value="divide" th:selected="${operation == 'divide'}">Osztás</option>
					</select>
				</div>
				<div class="col-3 col-12-small">
					<label for="right">Második szám</label>
					<input id="right" type="number" step="any" name="right" th:value="${right}" required />
				</div>
				<div class="col-12">
					<input type="submit" value="Számítás" class="primary" />
				</div>
			</div>
		</form>

		<p th:if="${result != null}">Eredmény: <strong th:text="${result}"></strong></p>
		<p th:if="${error}" th:text="${error}" role="alert"></p>
	</div>
</section>

<section th:replace="~{fragments/layout :: footer}"></section>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
